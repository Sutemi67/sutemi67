<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" width="100%" height="100%" role="img" aria-label="Product Architecture and Tech Stack">
  <title>Product Architecture &amp; Tech Stack</title>
  <defs>
    <!-- Градиент фона -->
    <radialGradient id="bg" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#0b172a"/>
      <stop offset="60%" stop-color="#050c18"/>
      <stop offset="100%" stop-color="#02050b"/>
    </radialGradient>

    <!-- Градиент карточек -->
    <linearGradient id="card-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#112946" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#07172b" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Сетка -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00f2fe" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>

    <!-- Фильтры неонового свечения -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-orange" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .f-title { font-family: 'Segoe UI', Ubuntu, sans-serif; font-weight: 700; fill: #ffffff; }
    .f-node { font-family: 'SFMono-Regular', Consolas, monospace; font-weight: 600; font-size: 14px; }
    .f-sub { font-family: 'Segoe UI', Ubuntu, sans-serif; font-size: 11px; fill: #8ab4f8; }
    .f-root { font-family: 'Segoe UI', Ubuntu, sans-serif; font-weight: 800; font-size: 18px; fill: #00f2fe; }

    /* CSS анимации */
    .dash-flow { stroke-dasharray: 6 8; animation: flow 2s linear infinite; }
    .pulse-glow { animation: pulse 3s ease-in-out infinite; }
    
    @keyframes flow { to { stroke-dashoffset: -14; } }
    @keyframes pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }

    @media (prefers-reduced-motion: reduce) {
      .dash-flow, .pulse-glow { animation: none; }
    }
  </style>

  <!-- Фон и сетка -->
  <rect width="1280" height="820" rx="16" fill="url(#bg)"/>
  <rect width="1280" height="820" rx="16" fill="url(#grid)"/>

  <!-- ================= ЛИНИИ СВЯЗЕЙ ================= -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- UI Ветка (Слева) -->
    <path d="M 640 60 L 440 60 L 440 120" stroke="#00f2fe" stroke-width="2"/>
    <path d="M 440 170 L 440 470 L 440 570" stroke="#00f2fe" stroke-width="2"/>
    
    <!-- UI -> Flutter & Kotlin & Rust egui -->
    <path d="M 440 210 L 320 210" stroke="#00f2fe" stroke-width="2"/>
    <path d="M 320 210 L 220 180 M 320 210 L 220 240" stroke="#00f2fe" stroke-width="1.5"/>
    
    <path d="M 440 330 L 320 330" stroke="#00f2fe" stroke-width="2"/>
    <path d="M 320 330 L 220 300" stroke="#00f2fe" stroke-width="1.5"/>
    <path class="dash-flow" d="M 320 330 L 220 355" stroke="#ff9f43" stroke-width="1.5"/>

    <path class="dash-flow" d="M 440 430 L 320 430 M 320 430 L 220 430" stroke="#ff9f43" stroke-width="1.5"/>

    <!-- UI -> Deployment -->
    <path d="M 440 620 L 440 670" stroke="#00f2fe" stroke-width="2"/>

    <!-- Backend Ветка (Справа) -->
    <path d="M 640 60 L 840 60 L 840 120" stroke="#00f2fe" stroke-width="2"/>
    <path d="M 840 170 L 840 570" stroke="#00f2fe" stroke-width="2"/>

    <!-- Backend -> Dart, Kotlin, Rust, Docker -->
    <path d="M 840 210 L 910 210 M 980 210 L 1030 210" stroke="#00f2fe" stroke-width="1.5"/>
    <path d="M 840 300 L 910 300 M 980 300 L 1030 330" stroke="#00f2fe" stroke-width="1.5"/>
    <path class="dash-flow" d="M 840 380 L 910 380 M 980 380 L 1030 340 M 980 380 L 1030 420" stroke="#ff9f43" stroke-width="1.5"/>
    
    <path d="M 840 490 L 940 490 L 940 570" stroke="#00f2fe" stroke-width="2"/>

    <!-- Backend -> Deployment -->
    <path d="M 840 620 L 840 670" stroke="#00f2fe" stroke-width="2"/>
  </g>

  <!-- ================= БЛОКИ И УЗЛЫ ================= -->

  <!-- ROOT: Product -->
  <g transform="translate(570, 35)">
    <rect width="140" height="50" rx="12" fill="#09203f" stroke="#00f2fe" stroke-width="2.5" filter="url(#glow-cyan)"/>
    <text class="f-root" x="70" y="31" text-anchor="middle">Product</text>
  </g>

  <!-- 1. UI BRANCH -->
  <g transform="translate(380, 120)">
    <rect width="120" height="50" rx="10" fill="url(#card-grad)" stroke="#00f2fe" stroke-width="2"/>
    <text class="f-title" x="60" y="31" text-anchor="middle" font-size="16">UI</text>
  </g>

  <!-- Flutter & Targets -->
  <g transform="translate(260, 185)">
    <rect width="110" height="45" rx="8" fill="url(#card-grad)" stroke="#00f2fe" stroke-width="1.5"/>
    <text class="f-node" x="55" y="27" fill="#00f2fe" text-anchor="middle">Flutter</text>
  </g>
  <g transform="translate(70, 160)">
    <rect width="130" height="38" rx="6" fill="#081b33" stroke="#4facfe" stroke-width="1"/>
    <text class="f-sub" x="65" y="23" text-anchor="middle">Desktop</text>
  </g>
  <g transform="translate(70, 220)">
    <rect width="130" height="38" rx="6" fill="#081b33" stroke="#4facfe" stroke-width="1"/>
    <text class="f-sub" x="65" y="23" text-anchor="middle">Multiplatform</text>
  </g>

  <!-- Kotlin UI & Targets -->
  <g transform="translate(260, 305)">
    <rect width="110" height="45" rx="8" fill="url(#card-grad)" stroke="#00f2fe" stroke-width="1.5"/>
    <text class="f-node" x="55" y="27" fill="#e2f1ff" text-anchor="middle">Kotlin</text>
  </g>
  <g transform="translate(70, 280)">
    <rect width="130" height="38" rx="6" fill="#081b33" stroke="#4facfe" stroke-width="1"/>
    <text class="f-sub" x="65" y="23" text-anchor="middle">Android native</text>
  </g>
  <g transform="translate(70, 335)">
    <rect width="130" height="38" rx="6" fill="#081b33" stroke="#ff9f43" stroke-width="1" stroke-dasharray="4 3"/>
    <text class="f-sub" x="65" y="23" fill="#ff9f43" text-anchor="middle">Multiplatform</text>
  </g>

  <!-- Rust egui & Target -->
  <g transform="translate(250, 405)">
    <rect width="120" height="45" rx="8" fill="url(#card-grad)" stroke="#ff9f43" stroke-width="1.5" stroke-dasharray="5 4" filter="url(#glow-orange)"/>
    <text class="f-node" x="60" y="27" fill="#ff9f43" text-anchor="middle">Rust egui</text>
  </g>
  <g transform="translate(70, 405)">
    <rect width="130" height="45" rx="6" fill="#081b33" stroke="#ff9f43" stroke-width="1" stroke-dasharray="4 3"/>
    <text class="f-sub" x="65" y="27" fill="#ff9f43" text-anchor="middle">Multiplatform</text>
  </g>

  <!-- UI CI/CD & Deploy -->
  <g transform="translate(345, 570)">
    <rect width="190" height="50" rx="8" fill="#09203f" stroke="#00f2fe" stroke-width="1.5"/>
    <text class="f-node" x="95" y="22" fill="#ffffff" text-anchor="middle">Github Actions</text>
    <text class="f-sub" x="95" y="38" text-anchor="middle">build apk/exe</text>
  </g>
  <g transform="translate(370, 670)">
    <rect width="140" height="45" rx="8" fill="#071930" stroke="#4facfe" stroke-width="1.5"/>
    <text class="f-title" x="70" y="28" text-anchor="middle" font-size="14">Publishing</text>
  </g>

  <!-- 2. BACKEND BRANCH -->
  <g transform="translate(780, 120)">
    <rect width="120" height="50" rx="10" fill="url(#card-grad)" stroke="#00f2fe" stroke-width="2"/>
    <text class="f-title" x="60" y="31" text-anchor="middle" font-size="16">Backend</text>
  </g>

  <!-- Dart & Details -->
  <g transform="translate(890, 185)">
    <rect width="90" height="45" rx="8" fill="url(#card-grad)" stroke="#00f2fe" stroke-width="1.5"/>
    <text class="f-node" x="45" y="27" fill="#00f2fe" text-anchor="middle">Dart</text>
  </g>
  <g transform="translate(1010, 172)">
    <rect width="210" height="70" rx="8" fill="#081b33" stroke="#4facfe" stroke-width="1"/>
    <text class="f-sub" x="12" y="22">• Startup</text>
    <text class="f-sub" x="12" y="40">• One language lazy project</text>
    <text class="f-sub" x="12" y="58">• Low RAM</text>
  </g>

  <!-- Kotlin & Details -->
  <g transform="translate(890, 275)">
    <rect width="90" height="45" rx="8" fill="url(#card-grad)" stroke="#00f2fe" stroke-width="1.5"/>
    <text class="f-node" x="45" y="27" fill="#e2f1ff" text-anchor="middle">Kotlin</text>
  </g>
  <g transform="translate(1010, 290)">
    <rect width="210" height="70" rx="8" fill="#081b33" stroke="#4facfe" stroke-width="1"/>
    <text class="f-sub" x="12" y="22">• Solid, long-distance projects</text>
    <text class="f-sub" x="12" y="40">• Concurrency</text>
    <text class="f-sub" x="12" y="58">• High load</text>
  </g>

  <!-- Rust & In-app FFI -->
  <g transform="translate(890, 355)">
    <rect width="90" height="45" rx="8" fill="url(#card-grad)" stroke="#ff9f43" stroke-width="1.5" stroke-dasharray="5 4" filter="url(#glow-orange)"/>
    <text class="f-node" x="45" y="27" fill="#ff9f43" text-anchor="middle">Rust</text>
  </g>
  <g transform="translate(1010, 400)">
    <rect width="110" height="38" rx="6" fill="#081b33" stroke="#ff9f43" stroke-width="1" stroke-dasharray="4 3"/>
    <text class="f-sub" x="55" y="23" fill="#ff9f43" text-anchor="middle">In-app FFI</text>
  </g>

  <!-- Docker (Параллельная ветка) -->
  <g transform="translate(895, 570)">
    <rect width="90" height="50" rx="8" fill="#081b33" stroke="#00f2fe" stroke-width="1.5"/>
    <text class="f-node" x="45" y="30" fill="#00f2fe" text-anchor="middle">Docker</text>
  </g>

  <!-- Backend CI/CD & Deploy -->
  <g transform="translate(745, 570)">
    <rect width="190" height="50" rx="8" fill="#09203f" stroke="#00f2fe" stroke-width="1.5"/>
    <text class="f-node" x="95" y="22" fill="#ffffff" text-anchor="middle">Github Actions</text>
    <text class="f-sub" x="95" y="38" text-anchor="middle">build exe</text>
  </g>
  <g transform="translate(745, 670)">
    <rect width="190" height="60" rx="8" fill="#071930" stroke="#4facfe" stroke-width="1.5"/>
    <text class="f-sub" x="15" y="25">• scp</text>
    <text class="f-sub" x="15" y="45">• nohup / kill / systemd</text>
  </g>
</svg>
